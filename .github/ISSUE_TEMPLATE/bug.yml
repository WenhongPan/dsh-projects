name: Bug report
description: Report a reproducible problem in dsh-projects.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the alpha more reliable. Remove private paths, prompts, and credentials before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: dsh-projects version
      placeholder: 0.2.0-alpha.2
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - DSH Desktop
        - Local Web UI
        - Remote Web UI
        - Headless or other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error text
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Other enabled UI, workspace, or session plugins
      description: Include plugin names and versions when known. This helps detect compatibility problems.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private prompts, and sensitive local paths from this report.
          required: true
